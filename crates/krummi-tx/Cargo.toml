[package]
name = "krummi-tx"
version = "0.1.0"
description = "Transactions of Krummi: snapshots, the single writer and its queue"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Commit and hand-off hooks and the Pager's fault injection, for the tests of this crate and the facade.
test-hooks = ["krummi-pager/test-hooks"]

[dependencies]
krummi-pager = { version = "0.1.0", path = "../krummi-pager" }

[lints]
workspace = true

[dev-dependencies]
krummi-tx = { path = ".", features = ["test-hooks"] }
tempfile = "3.27.0"
trybuild = "1.0.122"
