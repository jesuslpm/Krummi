[package]
name = "krummi"
version = "0.1.0"
description = "Krummi: an embedded transactional storage engine inspired by Voron"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
krummi-pager = { version = "0.1.0", path = "../krummi-pager" }
krummi-tree = { version = "0.1.0", path = "../krummi-tree" }
krummi-tx = { version = "0.1.0", path = "../krummi-tx" }

[lints]
workspace = true

[dev-dependencies]
# The engine's test hooks and fault injection, for the tests that make the store refuse writes (T12).
krummi-pager = { path = "../krummi-pager", features = ["test-hooks"] }
krummi-tx = { path = "../krummi-tx", features = ["test-hooks"] }
tempfile = "3.27.0"
trybuild = "1.0.122"
