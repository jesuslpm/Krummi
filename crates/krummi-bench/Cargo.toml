[package]
name = "krummi-bench"
version = "0.1.0"
description = "Comparative benchmark of Krummi against Voron, LMDB, redb, canopydb and fjall (module 6)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "krummi-bench"

[dependencies]
canopydb = "0.2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctrlc = "3.5.2"
fjall = "3.1.13"
heed = "0.23.1"
krummi = { version = "0.1.0", path = "../krummi" }
redb = "4.4.0"
sysinfo = "0.38.4"

# K14: the benchmark is not part of the engine. It may use unsafe code only where another engine's public interface
# requires it (opening an LMDB environment), so it denies unsafe code instead of inheriting the workspace's forbid.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tempfile = "3.27.0"
