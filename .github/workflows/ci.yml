# Checks of the engine on real Linux and Windows runners (see README, "Checks of the engine").
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The version used to develop the engine; bump it on purpose, since new lints or compiler messages
  # (the trybuild compile-fail test) can change.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # AC10 in full: flips every byte of a store, one at a time (65,536 reopens), for the Pager's pages and
      # for a store written through transactions.
      - name: Every-byte damage sweep (AC10)
        timeout-minutes: 30
        run: |
          cargo test -p krummi-pager --test pages -- --ignored ac10
          cargo test -p krummi-tx --test commit -- --ignored ac10
          cargo test -p krummi-tx --test recovery -- --ignored ac10
          cargo test -p krummi-tx --test free_space -- --ignored ac10
      # Trees: every byte of a 128 KiB store with trees and a value off its leaf, and of a store with a multi-value
      # tree (AC10, AC-M15), crashes at every point of a commit and of the close that follows it (AC-A16, AC-B18,
      # AC-R12, AC-V8, AC-M14), and a failure at every page operation of splits and merges, of range removals and
      # scans, of writes of values off their leaf, and of a write of a multi-value tree.
      - name: Tree acceptance sweeps (AC10, AC-A16, AC-B18, AC-R12, AC-V8, AC-M14, AC-M15)
        timeout-minutes: 120
        run: |
          cargo test -p krummi --test tree_integrity -- --ignored
          cargo test -p krummi --lib -- --ignored ac_b18 ac_r12 ac_v8 ac_m14
      - name: Free-space model with 100,000 operations (AC-F16)
        timeout-minutes: 30
        run: cargo test --release -p krummi-tx --test free_space -- --ignored ac_f16
