# Checks of the engine on real Linux and Windows runners (see README, "Checks of the engine").
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The version used to develop the engine; bump it on purpose, since new lints or compiler messages
  # (the trybuild compile-fail test) can change.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # AC10 in full: flips every byte of a store, one at a time (65,536 reopens), for the Pager's pages and
      # for a store written through transactions.
      - name: Every-byte damage sweep (AC10)
        timeout-minutes: 30
        run: |
          cargo test -p krummi-pager --test pages -- --ignored ac10
          cargo test -p krummi-tx --test commit -- --ignored ac10
          cargo test -p krummi-tx --test recovery -- --ignored ac10
          cargo test -p krummi-tx --test free_space -- --ignored ac10
      # Trees: every byte of a 128 KiB store with trees and a value off its leaf, and of a store with a multi-value
      # tree (AC10, AC-M15), crashes at every point of a commit and of the close that follows it (AC-A16, AC-B18,
      # AC-R12, AC-V8, AC-M14, AC-X12), and a failure at every page operation of splits and merges, of range removals
      # and scans, of writes of values off their leaf, of a write of a multi-value tree and of a write of a fixed-size
      # tree.
      - name: Tree acceptance sweeps (AC10, AC-A16, AC-B18, AC-R12, AC-V8, AC-M14, AC-M15, AC-X12)
        timeout-minutes: 120
        run: |
          cargo test -p krummi --test tree_integrity -- --ignored --skip ac_x13
          cargo test -p krummi --lib -- --ignored ac_b18 ac_r12 ac_v8 ac_m14 ac_x12
      # Every byte of a store with a fixed-size tree (AC-X13), apart and in release: it reopens the store once per
      # byte and took about 56 minutes in release on Windows, which the step above has no room for. The debug
      # assertions and overflow checks stay on, as in the other sweeps.
      - name: Fixed-size tree every-byte sweep (AC-X13)
        timeout-minutes: 120
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test --release -p krummi --test tree_integrity -- --ignored ac_x13
      - name: Free-space model with 100,000 operations (AC-F16)
        timeout-minutes: 30
        run: cargo test --release -p krummi-tx --test free_space -- --ignored ac_f16

  # The comparative benchmark, reduced, with its six engines (K12, AC-K6): it needs the .NET 10 SDK and the RavenDB
  # 7.2.7 source code, from which it builds Voron. Thresholds are not evaluated here (K11).
  benchmark:
    name: Reduced benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      KRUMMI_BENCH_RAVENDB: ${{ github.workspace }}/../ravendb-7.2.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # Third-party code that the job builds and runs: pinned to the commit of tag 7.2.7, so a moved tag fails the
      # job instead of changing what runs.
      - name: Get the RavenDB 7.2.7 source code
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch 7.2.7 https://github.com/ravendb/ravendb.git "$KRUMMI_BENCH_RAVENDB"
          test "$(git -C "$KRUMMI_BENCH_RAVENDB" rev-parse HEAD)" = "b84416401c6cd51a7d9a17f6d2fc7604b739fdf7"

      - name: Reduced run (AC-K6)
        shell: bash
        run: |
          cargo run --release -p krummi-bench -- --ravendb "$KRUMMI_BENCH_RAVENDB" --reducido --informe "$RUNNER_TEMP/banco.md"
          cat "$RUNNER_TEMP/banco.md"

      # The benchmark's tests that need .NET and RavenDB (AC-K5, AC-K9, AC-K10, AC-K13) are ignored by default and
      # fail when run without KRUMMI_BENCH_RAVENDB.
      - name: Benchmark tests with Voron
        run: cargo test --release -p krummi-bench -- --include-ignored
