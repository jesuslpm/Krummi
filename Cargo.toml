[workspace]
resolver = "3"
members = ["crates/krummi-pager", "crates/krummi-tx", "crates/krummi-tree", "crates/krummi"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

# D12: unsafe code is forbidden everywhere; only krummi-pager opts out (see its manifest).
[workspace.lints.rust]
unsafe_code = "forbid"
