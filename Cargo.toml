[workspace]
resolver = "3"
members = ["crates/muninndb-pager", "crates/muninndb-tx", "crates/muninndb"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

# D12: unsafe code is forbidden everywhere; only muninndb-pager opts out (see its manifest).
[workspace.lints.rust]
unsafe_code = "forbid"
